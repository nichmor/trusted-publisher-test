context:
  name: hello-trusted
  version: "0.1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - hello-trusted = hello_trusted.cli:main

requirements:
  host:
    - python >=3.9
    - pip
    - hatchling
  run:
    - python >=3.9

tests:
  - python:
      imports:
        - hello_trusted
  - script:
      - hello-trusted ci

about:
  summary: Tiny package used to exercise prefix.dev trusted publishing.
  license: MIT
