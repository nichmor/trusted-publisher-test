name: build-and-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# `id-token: write` lets the runner mint a GitHub OIDC token, which pixi
# exchanges with prefix.dev for a short-lived upload token. Without it,
# trusted publishing is silently skipped.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Full channel URL on the preview env. Trailing path is owner/channel.
      PREFIX_CHANNEL_URL: https://preview-pr-2140.prefix.dev/jora

    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: latest

      - name: Build and publish to prefix.dev (trusted publishing)
        run: pixi publish --to "$PREFIX_CHANNEL_URL"
