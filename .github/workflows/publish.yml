name: build-and-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# `id-token: write` is what makes the GitHub OIDC token available to the
# runner. Without it, rattler-build's trusted-publishing path can't fetch the
# token and will skip (TrustedPublishResult::Skipped).
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # --- Fill these in once the publisher is registered on prefix.dev ---
      # The full URL of the staging / preview instance, no trailing slash.
      PREFIX_SERVER_URL: https://<your-staging-host>
      # The channel the publisher is registered against.
      PREFIX_CHANNEL: <your-channel>

    steps:
      - uses: actions/checkout@v4

      - name: Install rattler-build
        uses: prefix-dev/rattler-build-action@v0.2.31
        with:
          # Pin to whatever release pairs with your PR's mint_token contract.
          rattler-build-version: latest

      - name: Build conda package
        run: rattler-build build --recipe recipe/recipe.yaml --output-dir output

      # No --api-key is passed. Because GITHUB_ACTIONS=true and id-token: write
      # is granted, rattler-build will:
      #   1. GET $ACTIONS_ID_TOKEN_REQUEST_URL?audience=prefix.dev
      #   2. POST {token} -> $PREFIX_SERVER_URL/api/oidc/mint_token
      #   3. Use the minted JWT as Bearer for the upload.
      - name: Upload to prefix.dev (trusted publishing)
        run: |
          rattler-build upload prefix \
            --url "$PREFIX_SERVER_URL" \
            --channel "$PREFIX_CHANNEL" \
            output/noarch/hello-trusted-*.conda
