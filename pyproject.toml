[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hello-trusted"
version = "0.1.0"
description = "Tiny package used to exercise prefix.dev trusted publishing."
requires-python = ">=3.9"
authors = [{ name = "trusted-publisher-test" }]
dependencies = []

[project.scripts]
hello-trusted = "hello_trusted.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_trusted"]
